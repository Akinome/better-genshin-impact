name: BetterGI Release
run-name: "BetterGI ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'BetterGI Version (e.g. 0.67.0)'
        required: true
        type: string
      create-release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version format: ${{ inputs.version }}"
            exit 1
          fi
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build_web_map_editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: huiyadanli/bettergi-map
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: web_map_editor
          path: dist/

  build_web_scripts_list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zaodonganqi/bettergi-script-web
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: web_scripts_list
          path: dist/

  build_dist:
    runs-on: windows-latest
    needs: [validate, build_web_map_editor, build_web_scripts_list]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Set version
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          (Get-Content BetterGenshinImpact/BetterGenshinImpact.csproj) -replace '<Version>.*</Version>', "<Version>$version</Version>" | Set-Content BetterGenshinImpact/BetterGenshinImpact.csproj

      - name: Build application
        shell: pwsh
        run: dotnet publish BetterGenshinImpact/BetterGenshinImpact.csproj -c Release -p:PublishProfile=FolderProfile -p:Version=${{ needs.validate.outputs.version }}

      - name: Clean and move files
        shell: pwsh
        run: |
          $sourceDir = ".\BetterGenshinImpact\bin\x64\Release\net10.0-windows10.0.22621.0\publish\win-x64"
          Get-ChildItem -Path $sourceDir -Recurse -Filter "*.lib" | Remove-Item -Force
          Get-ChildItem -Path $sourceDir -Recurse -Filter "*ffmpeg*.dll" | Remove-Item -Force
          Get-ChildItem -Path $sourceDir -Recurse -Filter "*.pdb" | Remove-Item -Force
          New-Item -Path "dist/BetterGI" -ItemType Directory -Force
          Copy-Item -Path "$sourceDir\*" -Destination ".\dist\BetterGI\" -Recurse -Force

      - name: Download web map editor
        uses: actions/download-artifact@v4
        with:
          name: web_map_editor
          path: dist/BetterGI/Assets/Map/Editor

      - name: Download web script repo
        uses: actions/download-artifact@v4
        with:
          name: web_scripts_list
          path: dist/BetterGI/Assets/Web/ScriptRepo

      - name: Create archive
        shell: pwsh
        run: |
          7z a "BetterGI_v${{ needs.validate.outputs.version }}.7z" ".\dist\BetterGI" -t7z -mx=5 -r -y

      - name: Verify bundled web assets
        shell: pwsh
        run: |
          $entries = 7z l "BetterGI_v${{ needs.validate.outputs.version }}.7z" | Out-String
          if ($entries -notmatch 'Assets[\\/]Map[\\/]Editor') {
            throw 'The archive does not contain Assets/Map/Editor.'
          }
          if ($entries -notmatch 'Assets[\\/]Web[\\/]ScriptRepo') {
            throw 'The archive does not contain Assets/Web/ScriptRepo.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BetterGI_7z
          path: BetterGI_v*.7z

  build_installer:
    runs-on: windows-latest
    needs: [validate, build_dist]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BetterGI_7z
          path: dist

      - name: Unpack BetterGI archive
        shell: pwsh
        run: |
          Set-Location dist
          7z x "BetterGI_v${{ needs.validate.outputs.version }}.7z"

      - name: Download kachina-builder
        uses: robinraju/release-downloader@v1.8
        with:
          repository: YuehaiTeam/kachina-installer
          latest: true
          fileName: kachina-builder.exe

      - name: Download latest upstream release
        uses: robinraju/release-downloader@v1.8
        with:
          repository: babalae/better-genshin-impact
          latest: true
          fileName: BetterGI_v*.7z
          out-file-path: last

      - name: Get second and third upstream release tags
        id: release_tags
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github.v3+json'
          }
          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/babalae/better-genshin-impact/releases' -Headers $headers
          $validReleases = $releases |
            Where-Object { -not $_.draft -and -not $_.prerelease } |
            Sort-Object { [DateTime]$_.published_at } -Descending
          if ($validReleases.Count -lt 3) {
            throw "At least three upstream releases are required; found $($validReleases.Count)."
          }
          "second_release_tag=$($validReleases[1].tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "third_release_tag=$($validReleases[2].tag_name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download second upstream release
        uses: robinraju/release-downloader@v1.8
        with:
          repository: babalae/better-genshin-impact
          tag: ${{ steps.release_tags.outputs.second_release_tag }}
          fileName: BetterGI_v*.7z
          out-file-path: 2nd

      - name: Download third upstream release
        uses: robinraju/release-downloader@v1.8
        with:
          repository: babalae/better-genshin-impact
          tag: ${{ steps.release_tags.outputs.third_release_tag }}
          fileName: BetterGI_v*.7z
          out-file-path: 3rd

      - name: Unpack upstream releases
        shell: pwsh
        run: |
          foreach ($directory in 'last', '2nd', '3rd') {
            Set-Location $directory
            7z x 'BetterGI*.7z' -otemp
            if (Test-Path -Path '.\temp\BetterGI' -PathType Container) {
              Move-Item -Path '.\temp\BetterGI' -Destination '.\BetterGI'
            } else {
              Rename-Item -Path '.\temp' -NewName 'BetterGI'
            }
            Set-Location ..
          }

      - name: Build installer
        shell: pwsh
        run: |
          Set-Location dist
          ..\kachina-builder.exe gen -j 6 -i BetterGI -m metadata.json -o hashed -r babalae/bettergi -t ${{ needs.validate.outputs.version }} --diff-vers ..\last\BetterGI --diff-vers ..\2nd\BetterGI --diff-vers ..\3rd\BetterGI --diff-ignore *[.txt,.onnx]
          ..\kachina-builder.exe pack -c ../Build/kachina.config.json -m metadata.json -d hashed -o BetterGI.Install.${{ needs.validate.outputs.version }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BetterGI_Install
          path: dist/BetterGI.Install.*.exe

  create_release:
    if: inputs.create-release == true
    needs: [validate, build_dist, build_installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: BetterGI_7z
          path: artifacts/BetterGI_7z

      - uses: actions/download-artifact@v4
        with:
          name: BetterGI_Install
          path: artifacts/BetterGI_Install

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BetterGI ${{ needs.validate.outputs.version }}
          body_path: .github/release-notes.md
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/BetterGI_7z/*.7z
            artifacts/BetterGI_Install/*.exe
